<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tehtävä 2 (luento 6)</title>
</head>
<body>
    <style>
        body {
            background-color: gray;
        }
    </style>
    <div style="display: flex; align-items: center; justify-content: center; height: 100vh;">
        <div style="background-color: yellow; display: flex; flex-direction: column; border: 10px solid yellow; border-radius: 10px; align-items: center;">
            <h1>Tehtävä 2 (luento 6)</h1>
            <div>
                <label>Luku1:</label>
                <input type="number"/>
            </div>
            <div>
                <label>Luku2:</label>
                <input type="number"/>
            </div>
            <p>anna luvut</p>
        </div>
    </div>
    <script>
        const n1 = document.querySelectorAll("input")[0];
        const n2 = document.querySelectorAll("input")[1];
        const p = document.querySelector("p");
        n1.addEventListener("input", addnumbs);
        n2.addEventListener("input", addnumbs);
        function addnumbs() {
            p.style.color = "black";
            if (n1.value=="" && n2.value=="") {
                p.innerHTML = "anna luvut";
            } else if (n1.value=="") {
                p.innerHTML = "anna luku 1";
            } else if (n2.value=="") {
                p.innerHTML = "anna luku 2";
            } else {
                if (isNaN(n1.value) && isNaN(n2.value)) {
                    p.innerHTML = "anna luvut";
                } else if (isNaN(n1.value)) {
                    p.innerHTML = "anna luku 1";
                } else if (isNaN(n2.value)) {
                    p.innerHTML = "anna luku 2";
                } else {
                    let tulos = Number(n1.value) + Number(n2.value);
                    if (tulos >=25 && tulos <=75) {
                        p.innerHTML = "ok";
                    } else if (tulos < 25) {
                        p.innerHTML = "liian pieni" 
                        p.style.color = "blue";
                    } else if (tulos > 75) {
                        p.innerHTML = "liian suuri"
                        p.style.color = "red";
                    } else {
                        p.innerHTML = "jotain meni pieleen";
                    }
                }
            }
        }
    </script>
</body>
</html>
